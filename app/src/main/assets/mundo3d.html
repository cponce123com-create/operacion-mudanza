<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Operación Mudanza · Mundo 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#21182c;color:#fff;font:14px system-ui}header,footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px;background:#382448}header strong{color:#ffdb8e}button{border:0;border-radius:8px;background:#ffedc9;color:#382448;padding:8px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}button.sel{background:#f2a55c}#area{display:flex;gap:4px;overflow:auto}main{position:relative;height:calc(100dvh - 114px);min-height:200px;background:#9ecb9e}canvas{display:block;width:100%;height:100%;touch-action:manipulation}#hint{position:absolute;top:8px;left:8px;max-width:75%;background:#2a2034dc;border-radius:8px;padding:8px;pointer-events:none}#items{position:absolute;right:6px;top:6px;max-height:90%;width:min(225px,37vw);overflow:auto;background:#fff3dded;color:#382448;border-radius:9px;padding:6px}#items button{width:100%;text-align:left;margin:2px 0;background:#f3d6b0}#items small{display:block;font-weight:400}footer span{flex:1}#modal{position:absolute;inset:0;background:#1c172bda;display:grid;place-items:center}#panel{background:#fff1d9;color:#382448;padding:16px;border-radius:12px;max-width:520px;max-height:90%;overflow:auto}#panel h2{margin:0 0 6px}#panel p{line-height:1.4}#panel button{background:#e9bd90} .hide{display:none!important}@media(max-height:450px){header,footer{padding:3px}button{padding:5px;font-size:12px}main{height:calc(100dvh - 76px)}#hint{font-size:11px}}
</style></head><body><header><strong>OPERACIÓN MUDANZA · 3D</strong><span id="stats"></span><div id="area"></div><button id="truck">🚚 Camión</button><button id="back">Versión anterior</button></header><main><canvas id="world" aria-label="Escena tridimensional de la mudanza"></canvas><div id="hint"></div><div id="items"></div><div id="modal" class="hide"><div id="panel"></div></div></main><footer><span id="status"></span><button id="help">? Ayuda</button><button id="reset">↻ Reiniciar 3D</button></footer><script src="packing-3d.js"></script><script src="routes-3d.js"></script><script src="mundo3d.js"></script></body></html>
