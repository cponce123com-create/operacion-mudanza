name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node tests/truck-view.test.js && node tests/placement-rules.test.js && node tests/progress.test.js && node tests/dialogue.test.js && node tests/game-smoke.test.js && node tests/daily-smoke.test.js && node tests/full-game.test.js
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Anthonela-APK
          path: app/build/outputs/apk/debug/app-debug.apk
